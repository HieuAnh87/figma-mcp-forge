name: Release Forge
on:
  workflow_dispatch:
    inputs:
      version:
        description: Committed package version to publish (for example 0.1.0)
        required: true
        type: string
permissions:
  contents: write
  id-token: write
concurrency:
  group: forge-npm-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - name: Check committed version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const version = process.env.RELEASE_VERSION;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw new Error('Invalid version');
          for (const dir of ['server', 'plugin']) {
            if (JSON.parse(readFileSync(`${dir}/package.json`)).version !== version) throw new Error(`${dir} version mismatch`);
          }
          JS
      - name: Install build dependencies
        run: |
          bun install --frozen-lockfile
          (cd server && bun install --frozen-lockfile)
          (cd plugin && bun install --frozen-lockfile)
      - name: Validate
        run: |
          bun run check
          (cd server && npm test)
      - name: Pack and smoke test
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          (cd server && npm pack)
          node scripts/smoke-package.mjs "server/figma-mcp-forge-${RELEASE_VERSION}.tgz"
      - name: Publish using npm trusted publishing
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm publish "./server/figma-mcp-forge-${RELEASE_VERSION}.tgz" --access public --provenance
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Figma MCP Forge v${{ inputs.version }}
          generate_release_notes: true
          files: server/figma-mcp-forge-${{ inputs.version }}.tgz
